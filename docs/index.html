<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>🍅 洋柿子的工作台</title>
<style>
:root{--bg:#f1ece6;--bg2:#e9e2da;--card:#fbf8f4;--pink:#d8b4ae;--pink-soft:#ecd9d5;--green:#a9bfb0;--green-soft:#d6e2da;--blue:#a7b5c9;--blue-soft:#d8e0ea;--clay:#c9b7a6;--clay-soft:#e7dccf;--text:#5b5048;--muted:#9a8f85;--line:#e4dcd3;--shadow:0 8px 24px rgba(120,105,92,.12);--radius:18px}
*{box-sizing:border-box}html,body{margin:0;height:100%}body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
.hidden{display:none!important}button{font-family:inherit;cursor:pointer;border:none}
.auth-overlay{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--green-soft),var(--pink-soft),var(--blue-soft));padding:20px}
.auth-card{width:100%;max-width:360px;background:var(--card);border-radius:24px;padding:32px 26px;box-shadow:var(--shadow);text-align:center}
.auth-logo{font-size:52px}.auth-title{margin:6px 0 2px;font-size:22px}.auth-sub{margin:0 0 18px;color:var(--muted);font-size:13px}
.auth-tabs{display:flex;gap:8px;background:var(--bg2);border-radius:14px;padding:4px;margin-bottom:16px}
.auth-tab{flex:1;padding:10px;border-radius:11px;background:transparent;color:var(--muted);font-size:14px}
.auth-tab.active{background:var(--card);color:var(--text);box-shadow:var(--shadow);font-weight:600}
.auth-card input{width:100%;padding:13px 15px;margin-bottom:12px;border:1.5px solid var(--line);border-radius:14px;background:var(--bg);font-size:15px;color:var(--text);outline:none}
.auth-card input:focus{border-color:var(--green)}
.auth-msg{color:#c98a82;font-size:13px;min-height:18px;margin:8px 0 0}
.btn-primary{width:100%;padding:13px;border-radius:14px;background:var(--pink);color:#fff;font-size:15px;font-weight:600;box-shadow:var(--shadow);transition:transform .1s}
.btn-primary:active{transform:scale(.98)}.btn-primary:disabled{opacity:.6}
.btn-ghost{background:transparent;color:var(--muted);font-size:13px;padding:6px 10px;border-radius:10px}.btn-ghost:hover{background:var(--bg2)}
.btn-soft{background:var(--green-soft);color:var(--text);padding:9px 14px;border-radius:12px;font-size:14px}.btn-soft:hover{background:var(--green);color:#fff}
.app{display:flex;min-height:100vh}.sidebar{width:220px;flex-shrink:0;background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:22px 16px;position:sticky;top:0;height:100vh}
.brand{font-size:20px;font-weight:700;margin-bottom:24px;display:flex;align-items:center;gap:8px}.brand span{color:var(--text)}
#nav{display:flex;flex-direction:column;gap:6px;flex:1}.nav-item{text-align:left;padding:13px 14px;border-radius:14px;background:transparent;color:var(--muted);font-size:15px;transition:all .15s}
.nav-item:hover{background:var(--bg2);color:var(--text)}.nav-item.active{background:var(--clay-soft);color:var(--text);font-weight:600}
.sidebar-foot{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:6px}.user-email{font-size:12px;color:var(--muted);word-break:break-all}
.view{flex:1;padding:30px 34px;max-width:920px;width:100%}
.page-head{margin-bottom:22px}.page-title{font-size:24px;margin:0 0 4px}.page-sub{color:var(--muted);font-size:14px;margin:0}
.card{background:var(--card);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);margin-bottom:18px}
.card-title{font-size:16px;margin:0 0 14px;display:flex;align-items:center;gap:8px}
.home-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px}
.stat{background:var(--card);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);cursor:pointer;transition:transform .12s}
.stat:hover{transform:translateY(-3px)}.stat .emoji{font-size:30px}.stat .num{font-size:28px;font-weight:700;margin:8px 0 2px}.stat .label{color:var(--muted);font-size:13px}
.stat.pink{background:var(--pink-soft)}.stat.green{background:var(--green-soft)}.stat.blue{background:var(--blue-soft)}.stat.clay{background:var(--clay-soft)}
.plans-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.add-row{display:flex;gap:10px;margin-bottom:14px}.add-row input{flex:1;padding:11px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);font-size:14px;color:var(--text);outline:none}.add-row input:focus{border-color:var(--green)}
.plan-item{display:flex;align-items:center;gap:12px;padding:13px 15px;background:var(--bg);border-radius:14px;margin-bottom:10px}
.plan-item .chk{width:22px;height:22px;border-radius:8px;border:2px solid var(--green);flex-shrink:0;display:flex;align-items:center;justify-content:center;background:transparent;color:#fff;font-size:14px}
.plan-item.done .chk{background:var(--green)}.plan-item .txt{flex:1;font-size:15px}.plan-item.done .txt{text-decoration:line-through;color:var(--muted)}
.plan-item .del{background:transparent;color:var(--muted);font-size:18px;padding:4px 8px;border-radius:8px}.plan-item .del:hover{background:var(--pink-soft);color:#c98a82}
.progress-bar{height:10px;background:var(--bg2);border-radius:6px;overflow:hidden;margin:6px 0 14px}.progress-fill{height:100%;background:var(--green);border-radius:6px;transition:width .3s}
.tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}.tab{padding:9px 16px;border-radius:12px;background:var(--bg2);color:var(--muted);font-size:14px}.tab.active{background:var(--clay-soft);color:var(--text);font-weight:600}
.checkin{text-align:center;padding:18px;border-radius:16px;background:var(--green-soft);margin-bottom:16px}.checkin .streak{font-size:30px;font-weight:700}.checkin .done-today{color:var(--green);font-weight:600}
.word-card,.grammar-card{background:var(--bg);border-radius:16px;padding:16px 18px;margin-bottom:12px;border-left:5px solid var(--pink)}
.grammar-card{border-left-color:var(--blue)}.word-card .w{font-size:20px;font-weight:700}.word-card .ph{color:var(--muted);font-size:13px;margin-left:8px}.word-card .mean{margin:6px 0}.word-card .ex{color:var(--muted);font-size:13px;font-style:italic}.tag-mastered{font-size:12px;color:var(--green);font-weight:600}
.sport-form{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}.sport-form select,.sport-form input{padding:11px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);font-size:14px;color:var(--text);outline:none}
.record-item{display:flex;align-items:center;gap:12px;padding:12px 15px;background:var(--bg);border-radius:14px;margin-bottom:10px}.record-item .type{font-weight:600}.record-item .min{color:var(--muted);font-size:13px}.record-item .date{margin-left:auto;color:var(--muted);font-size:12px}
.goal-row{display:flex;align-items:center;gap:10px}
.empty{color:var(--muted);text-align:center;padding:24px;font-size:14px}
.news-tabs{display:flex;gap:8px;margin-bottom:16px}.news-item{padding:16px 18px;background:var(--bg);border-radius:16px;margin-bottom:12px;border-left:5px solid var(--blue)}.news-item .nt{font-size:16px;font-weight:600;line-height:1.5}.news-item .nm{color:var(--muted);font-size:12px;margin-top:8px;display:flex;gap:12px}.news-item .ns{color:var(--text)}
@media(max-width:720px){.app{flex-direction:column}.sidebar{width:100%;height:auto;position:static;flex-direction:row;align-items:center;padding:10px 12px;overflow-x:auto}.brand{margin:0 10px 0 0;font-size:16px}.brand span{display:none}#nav{flex-direction:row;gap:4px;flex:1}.nav-item{padding:9px 12px;font-size:13px;white-space:nowrap}.sidebar-foot{flex-direction:row;border:none;padding:0}.sidebar-foot .user-email{display:none}.view{padding:18px 16px}}

</style>
</head>
<body>
<div id="auth" class="auth-overlay"><div class="auth-card">
<div class="auth-logo">🍅</div><h1 class="auth-title">洋柿子的工作台</h1>
<p class="auth-sub">手机直接打开的本地版 · 数据存在本机</p>
<div class="auth-tabs"><button class="auth-tab active" data-mode="login">登录</button><button class="auth-tab" data-mode="register">注册</button></div>
<input id="email" type="email" placeholder="邮箱" autocomplete="email"/><input id="password" type="password" placeholder="密码（至少 6 位）"/>

</div></div>
<div id="app" class="app hidden">

<div class="sidebar-foot"><span id="userEmail" class="user-email"></span><button id="logoutBtn" class="btn-ghost">退出</button></div></aside>
<main id="view" class="view"></main></div>
<script>
const CONTENT={planTemplates:["喝够 8 杯水 💧","复习 20 个四级单词 📚","散步 15 分钟 🚶","做一组拉伸 🧘","读 10 页书 📖","写今日三件小确幸 ✍️","整理桌面 5 分钟 🧹","早睡，11 点前躺下 🌙","背 1 个语法点 📝","给家人或朋友发条消息 💌","运动 30 分钟 🏃","吃一份水果 🍎","练习英语听力 10 分钟 🎧","冥想 5 分钟 🌿","学一道新菜 🍳","复盘今天做了什么 🔁","喝水提醒设置好 ⏰","护眼远眺 2 分钟 👀","写明日待办清单 📋","整理手机相册 📷","存下 10 元零钱 🐷","做 15 个深蹲 🦵","朗读英语 5 分钟 🗣️","关掉一条无用通知 🔕","给自己一个小奖励 🍬","清洁手机屏幕 📱","计划周末一次出门 🌞","复习昨天的内容 🔍"],
words:[{w:"abandon",ph:"/əˈbændən/",mean:"v. 放弃；抛弃",ex:"He had to abandon his car in the snow."},{w:"ability",ph:"/əˈbɪləti/",mean:"n. 能力；才能",ex:"She has the ability to learn languages fast."},{w:"absolute",ph:"/ˈæbsəluːt/",mean:"adj. 绝对的；完全的",ex:"There is no absolute truth in the world."},{w:"academic",ph:"/ˌækəˈdemɪk/",mean:"adj. 学术的；学院的",ex:"He focuses on academic research."},{w:"accept",ph:"/əkˈsept/",mean:"v. 接受；同意",ex:"I accept your invitation gladly."},{w:"access",ph:"/ˈækses/",mean:"n./v. 通道；接近；使用",ex:"Students have free access to the library."},{w:"accompany",ph:"/əˈkʌmpəni/",mean:"v. 陪伴；伴随",ex:"She accompanied me to the hospital."},{w:"achieve",ph:"/əˈtʃiːv/",mean:"v. 达到；实现",ex:"Hard work helps you achieve your goals."},{w:"acquire",ph:"/əˈkwaɪə(r)/",mean:"v. 获得；习得",ex:"Children acquire language quickly."},{w:"adequate",ph:"/ˈædɪkwət/",mean:"adj. 足够的；适当的",ex:"The food was adequate but not great."},{w:"advance",ph:"/ədˈvɑːns/",mean:"v./n. 前进；进展",ex:"Science has advanced rapidly."},{w:"advantage",ph:"/ədˈvɑːntɪdʒ/",mean:"n. 优点；有利条件",ex:"Practice gives you an advantage."},{w:"afford",ph:"/əˈfɔːd/",mean:"v. 负担得起",ex:"I cannot afford a new phone now."},{w:"ancient",ph:"/ˈeɪnʃənt/",mean:"adj. 古代的；古老的",ex:"They visited an ancient temple."},{w:"anxiety",ph:"/æŋˈzaɪəti/",mean:"n. 焦虑；忧虑",ex:"Exam anxiety is common among students."},{w:"apparent",ph:"/əˈpærənt/",mean:"adj. 明显的；表面的",ex:"It was apparent that he was tired."},{w:"appetite",ph:"/ˈæpɪtaɪt/",mean:"n. 食欲；欲望",ex:"Walking gave me a good appetite."},{w:"application",ph:"/ˌæplɪˈkeɪʃn/",mean:"n. 申请；应用",ex:"Send your job application by email."},{w:"approach",ph:"/əˈprəʊtʃ/",mean:"v./n. 接近；方法",ex:"We need a new approach to the problem."},{w:"argue",ph:"/ˈɑːɡjuː/",mean:"v. 争论；主张",ex:"They argued about the plan."},{w:"arise",ph:"/əˈraɪz/",mean:"v. 出现；升起",ex:"A new problem arose yesterday."},{w:"assess",ph:"/əˈses/",mean:"v. 评估；评定",ex:"Teachers assess students by exams."},{w:"assume",ph:"/əˈsjuːm/",mean:"v. 假定；承担",ex:"I assume you have read the book."},{w:"atmosphere",ph:"/ˈætməsfɪə(r)/",mean:"n. 大气；氛围",ex:"The cafe has a cozy atmosphere."},{w:"attitude",ph:"/ˈætɪtjuːd/",mean:"n. 态度；看法",ex:"Her attitude toward work is positive."},{w:"attribute",ph:"/əˈtrɪbjuːt/",mean:"v. 把…归因于",ex:"He attributes his success to hard work."},{w:"authority",ph:"/ɔːˈθɒrəti/",mean:"n. 权威；当局",ex:"The authority banned the activity."},{w:"available",ph:"/əˈveɪləbl/",mean:"adj. 可获得的；有空的",ex:"Is the manager available now?"},{w:"average",ph:"/ˈævərɪdʒ/",mean:"adj./n. 平均（的）",ex:"The average score is 80."},{w:"balance",ph:"/ˈbæləns/",mean:"n./v. 平衡",ex:"Try to balance work and life."},{w:"benefit",ph:"/ˈbenɪfɪt/",mean:"n./v. 益处；受益",ex:"Exercise benefits your health."},{w:"brilliant",ph:"/ˈbrɪliənt/",mean:"adj. 杰出的；明亮的",ex:"She has a brilliant idea."},{w:"circumstance",ph:"/ˈsɜːkəmstəns/",mean:"n. 情况；环境",ex:"Under no circumstance should you lie."},{w:"commit",ph:"/kəˈmɪt/",mean:"v. 承诺；犯（错）",ex:"He committed to finishing the project."},{w:"community",ph:"/kəˈmjuːnəti/",mean:"n. 社区；群体",ex:"We live in a friendly community."},{w:"comprehension",ph:"/ˌkɒmprɪˈhenʃn/",mean:"n. 理解（力）",ex:"Reading improves comprehension."},{w:"consequence",ph:"/ˈkɒnsɪkwəns/",mean:"n. 结果；后果",ex:"Face the consequence of your choice."},{w:"considerable",ph:"/kənˈsɪdərəbl/",mean:"adj. 相当大的",ex:"It took considerable effort."},{w:"consume",ph:"/kənˈsjuːm/",mean:"v. 消耗；消费",ex:"Cars consume a lot of fuel."},{w:"contribute",ph:"/kənˈtrɪbjuːt/",mean:"v. 贡献；投稿",ex:"Everyone can contribute to the team."},{w:"convenient",ph:"/kənˈviːniənt/",mean:"adj. 方便的",ex:"Online shopping is convenient."},{w:"crucial",ph:"/ˈkruːʃl/",mean:"adj. 关键的",ex:"Sleep is crucial for health."},{w:"decline",ph:"/dɪˈklaɪn/",mean:"v./n. 下降；拒绝",ex:"Sales declined last month."},{w:"demonstrate",ph:"/ˈdemənstreɪt/",mean:"v. 证明；演示",ex:"The test demonstrates the theory."},{w:"distinguish",ph:"/dɪˈstɪŋɡwɪʃ/",mean:"v. 区分",ex:"It is hard to distinguish the twins."},{w:"efficiency", grammar:[{title:"一般过去时 vs 现在完成时",body:"一般过去时强调过去某个时间点发生的动作（I went there yesterday）；现在完成时强调过去动作对现在的影响（I have been there, so I know it）。"},{title:"定语从句：that / which / who",body:"指人用 who/that，指物用 which/that。that 通用但不用于非限制性定语从句。例：The book that/which I read is great."},{title:"虚拟语气（与现在相反）",body:"If + 过去式, ... would + 动词原形。例：If I were you, I would study harder."},{title:"比较级与最高级",body:"单音节词 +er/est（fast→faster→fastest）；多音节用 more/most（important→more important→most important）。"},{title:"被动语态",body:"be + 过去分词。一般现在时：am/is/are done；一般过去时：was/were done。例：The letter was written by him."},{title:"非谓语动词：to do / doing",body:"作目的用 to do（I came to help）；作主语/宾语常用 doing（Reading is fun）；介词后必须用 doing。"},{title:"情态动词表推测",body:"must 表肯定推测（He must be tired）；can't 表否定推测（He can't be at home）；may/might 表可能。"},{title:"名词性从句",body:"that / what / whether 引导，在句中作主语、宾语或表语。例：What he said is true."},{title:"倒装句",body:"否定词开头（Never / Not only）要部分倒装：Not only did he come, but he also helped."},{title:"冠词 a/an/the 用法",body:"泛指用 a/an（an 用于元音音素前）；特指用 the；抽象/泛指复数常不用冠词。"},{title:"状语从句连词",body:"时间 when/while/as；原因 because/since/as；让步 although/though；条件 if/unless。"},{title:"主谓一致",body:"主语为单数用单数动词；and 连接两主语用复数；不可数名词用单数；each 作主语用单数。"},{title:"现在分词作状语",body:"表示主动/进行：Hearing the news, she smiled.（听到消息，她笑了。）"},{title:"过去分词作定语/状语",body:"表示被动/完成：The broken cup（被打碎的杯子）；Seen from here, it looks small."},{title:"强调句 It is ... that",body:"It is + 被强调部分 + that + 其余。例：It was Tom that broke the window."},{title:"反意疑问句",body:"前肯后否、前否后肯，助动词一致。例：You like it, don't you?"},{title:"可数与不可数名词",body:"不可数（water, advice, information）无复数、不加 a；需表数量用 a piece of advice 等。"},{title:"祈使句与建议",body:"动词原形开头（Open the door）；建议用 Let's / Why not / How about + doing。"},{title:"将来时态辨析",body:"will 表意愿/预测；be going to 表计划/迹象；be doing 表已安排（I am leaving tomorrow）。"},{title:"代词：it / one / that",body:"it 指代同一物；one 泛指同类中的一个；that 指代同类不同个（常用于比较）。"}],

function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function today(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function dayOfYear(){const n=new Date(),s=new Date(n.getFullYear(),0,0);return Math.floor((n-s)/86400000)}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function fmtDate(s){const d=new Date(s);return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`}

function hash(pw){let h=0;for(let i=0;i<pw.length;i++){h=(h*31+pw.charCodeAt(i))>>>0}return 'h'+h}

function realNews(v){
  v.innerHTML=`<div class='page-head'><h2 class='page-title'>📰 每日热点新闻</h2><p class='page-sub'>国际热点 · 政治热点 · 实时更新</p></div><div class='news-tabs'><button class='tab active' data-t='all'>🔥 全部热点</button><button class='tab' data-t='international'>🌍 国际热点</button><button class='tab' data-t='politics'>🏛 政治热点</button></div><div id='newsList'><div class='empty'>正在加载实时新闻…</div></div>`;
  let cur='all';
  const tabs=v.querySelectorAll('.tab');
  tabs.forEach(function(tb){tb.onclick=function(){tabs.forEach(function(x){x.classList.toggle('active',x===tb)});cur=tb.dataset.t;load(cur)}});
  function cat(items){
    const inter=['国际','全球','海外','外国','美国','美方','俄','欧洲','欧盟','日本','韩国','朝鲜','联合国','外交','特朗普','拜登','普京','北约','中东','英国','法国','德国','印度','东盟','世贸','世卫','加','澳'];
    const poli=['政策','法规','法律','法案','央行','货币','财政','税收','政府','国务','部长','主席','国务院','发改委','监管','立法','改革','选举','军委','两会','人大'];
    return items.map(function(t){return{t:t,inter:inter.some(function(k){return t.indexOf(k)>=0}),poli:poli.some(function(k){return t.indexOf(k)>=0})}})
  }
  function load(type){
    const box=document.getElementById('newsList');
    const raw=state.newsCache||[];
    let list=raw;
    if(type==='international')list=raw.filter(function(x){return x.inter&&!x.poli});
    if(type==='politics')list=raw.filter(function(x){return x.poli});
    if(!list.length){box.innerHTML=`<div class='empty'>`+(raw.length?'该分类暂无相关新闻':'暂无可显示的新闻')+`</div>`;return}
    box.innerHTML=list.map(function(n){return `<div class='news-item'><div class='nt'>`+esc(n.t)+`</div><div class='nm'><span>🌐 60s 每日新闻</span><span>🕒 `+(state.newsDate||'')+`</span></div></div>`}).join('')}
  load(cur);
  if(!state.newsCache){
    fetch('https://60s.viki.moe/v2/60s').then(function(r){return r.json()}).then(function(d){const arr=(d&&d.data&&d.data.news)||[];state.newsCache=cat(arr);state.newsDate=(d&&d.data&&d.data.date)||'';load(cur)}).catch(function(){if(!state.newsCache){state.newsCache=cat(['示例：国际热点（网络不通，显示示例）','示例：国内政治动态（网络不通，显示示例）']);load(cur)}})
  }
}

function genRandomPlans(){const pool=CONTENT.planTemplates.slice();const n=Math.random()<.5?1:2,out=[];for(let i=0;i<n&&pool.length;i++){const idx=Math.floor(Math.random()*pool.length);out.push({id:uid(),text:pool.splice(idx,1)[0],done:false})}return out}

function renderEnglish(v){const en=state.data.english,t=today(),checked=en.last===t;v.innerHTML=`<div class="page-head"><h2 class="page-title">📚 四级英语学习</h2><p class="page-sub">打卡不停，词汇和语法天天见</p></div><div class="checkin"><div class="streak">🔥 ${en.streak} 天</div><div style="color:var(--muted);font-size:13px;margin:4px 0 12px">连续打卡</div><button class="btn-primary" id="enCheck" ${checked?'disabled':''}>${checked?'✅ 今天已打卡':'今日打卡'}</button></div><div class="tabs"><button class="tab active" data-t="word">单词</button><button class="tab" data-t="grammar">语法</button><button class="tab" data-t="video">视频</button></div><div id="enBody"></div>`;$('#enCheck').onclick=()=>{const y=new Date(Date.now()-86400000).toISOString().slice(0,10);en.streak=(en.last===y)?en.streak+1:1;en.last=t;saveData();renderEnglish(v)};const tabs=v.querySelectorAll('.tab');tabs.forEach(tb=>tb.onclick=()=>{tabs.forEach(x=>x.classList.toggle('active',x===tb));body(tb.dataset.t)});function body(kind){const b=$('#enBody');if(kind==='grammar'){const g=CONTENT.grammar[dayOfYear()%CONTENT.grammar.length],fav=en.favGrammar.includes(g.title);b.innerHTML=`<div class="grammar-card"><div style="font-weight:700;margin-bottom:8px">${esc(g.title)}</div><div>${esc(g.body)}</div><button class="btn-soft" id="favG" style="margin-top:12px">${fav?'⭐ 已收藏':'☆ 收藏'}</button></div>`;$('#favG').onclick=()=>{if(en.favGrammar.includes(g.title))en.favGrammar=en.favGrammar.filter(x=>x!==g.title);else en.favGrammar.push(g.title);saveData();body('grammar')}}else if(kind==='video'){const vs=VIDEOS;let vh=`<div style='color:var(--muted);font-size:13px;margin:4px 0 14px'>配套四级学习视频，点开即可观看，来源已标注 👇</div>`;vs.forEach(v=>{vh+=`<div style='border:1.5px solid var(--line);border-radius:16px;padding:14px 16px;background:var(--card);margin-bottom:12px'><div style='margin-bottom:8px'><span style='background:var(--pink-soft);color:#9a6f68;font-size:12px;padding:2px 10px;border-radius:999px'>来源：${esc(v.s)}</span></div><div style='font-weight:700;margin-bottom:4px'>${esc(v.t)}</div><div style='color:var(--muted);font-size:13px;margin-bottom:12px'>${esc(v.note)||''}</div><a href='${esc(v.url)}' target='_blank' rel='noopener' style='display:inline-block;background:var(--pink);color:#fff;text-decoration:none;padding:9px 16px;border-radius:12px;font-size:14px;font-weight:600'>▶ 点开观看</a></div>`});b.innerHTML=vh}else{const words=CONTENT.words,start=(dayOfYear()*3)%words.length;let h='';for(let i=0;i<6;i++){const wd=words[(start+i)%words.length],m=en.mastered.includes(wd.w);h+=`<div class="word-card"><div><span class="w">${esc(wd.w)}</span><span class="ph">${esc(wd.ph)}</span> ${m?'<span class="tag-mastered">✓ 已掌握</span>':''}</div><div class="mean">${esc(wd.mean)}</div><div class="ex">${esc(wd.ex)}</div><button class="btn-soft" data-w="${esc(wd.w)}" style="margin-top:8px">${m?'取消掌握':'标记掌握'}</button></div>`}b.innerHTML=h;b.querySelectorAll('button[data-w]').forEach(btn=>btn.onclick=()=>{const w=btn.dataset.w;if(en.mastered.includes(w))en.mastered=en.mastered.filter(x=>x!==w);else en.mastered.push(w);saveData();body('word')})}body('word')}}
function renderSports(v){const sp=state.data.sports,t=today(),checked=sp.last===t,weekAgo=new Date(Date.now()-7*86400000),wc=sp.records.filter(r=>new Date(r.date)>=weekAgo).length;v.innerHTML=`<div class="page-head"><h2 class="page-title">🏃 运动</h2><p class="page-sub">动起来，身体会感谢你</p></div><div class="checkin"><div class="streak">🔥 ${sp.streak} 天</div><div style="color:var(--muted);font-size:13px;margin:4px 0 12px">连续打卡</div><button class="btn-primary" id="spCheck" ${checked?'disabled':''}>${checked?'✅ 今天已打卡':'今日打卡'}</button></div><div class="card"><div class="card-title">🎯 本周目标</div><div class="goal-row"><span>每周运动</span><input id="goal" type="number" min="1" max="14" value="${sp.goal}" style="width:64px;padding:8px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);text-align:center"/><span>次 · 已达成 ${wc} 次</span></div><div class="progress-bar" style="margin-top:12px"><div class="progress-fill" style="width:${Math.min(100,Math.round(wc/sp.goal*100))}%"></div></div></div><div class="card"><div class="card-title">➕ 记录一次运动</div><div class="sport-form"><select id="spType">${CONTENT.sportTypes.map(s=>`<option>${s}</option>`).join('')}</select><input id="spMin" type="number" min="1" placeholder="分钟" style="width:90px"/><button class="btn-primary" style="width:auto;padding:11px 18px" id="addRec">保存记录</button></div><div id="recList"></div></div>`;$('#spCheck').onclick=()=>{const y=new Date(Date.now()-86400000).toISOString().slice(0,10);sp.streak=(sp.last===y)?sp.streak+1:1;sp.last=t;saveData();renderSports(v)};$('#goal').onchange=()=>{sp.goal=Math.max(1,parseInt($('#goal').value)||3);saveData();renderSports(v)};$('#addRec').onclick=()=>{const type=$('#spType').value,min=parseInt($('#spMin').value);if(!min||min<=0){alert('请输入运动分钟数');return}sp.records.unshift({id:uid(),type,min,date:new Date().toISOString()});$('#spMin').value='';saveData();renderSports(v)};const rl=$('#recList');if(!sp.records.length)rl.innerHTML='<div class="empty">还没有运动记录，动一下试试～</div>';sp.records.slice(0,12).forEach(r=>{const el=document.createElement('div');el.className='record-item';el.innerHTML=`<span class="type">${esc(r.type)}</span><span class="min">${r.min} 分钟</span><span class="date">${fmtDate(r.date)}</span>`;rl.appendChild(el)})}
function renderNews(v){v.innerHTML=`<div class="page-head"><h2 class="page-title">📰 每日热点新闻</h2><p class="page-sub">国际热点 · 政治热点（示例内容）</p></div><div class="news-tabs"><button class="tab active" data-t="international">🌍 国际热点</button><button class="tab" data-t="politics">🏛 政治热点</button></div><div id="newsList"></div>`;let cur='international';const tabs=v.querySelectorAll('.tab');tabs.forEach(tb=>tb.onclick=()=>{tabs.forEach(x=>x.classList.toggle('active',x===tb));cur=tb.dataset.t;load(cur)});function load(type){const items=type==='politics'?[{title:'示例 · 国内政策热点',source:'示例源',time:new Date().toISOString(),summary:'部署到云端并配置新闻 API Key 后，这里会显示真实实时政治热点。'},{title:'示例 · 民生与法治动态',source:'示例源',time:new Date().toISOString(),summary:'上线后可获取实时更新的政治类新闻。'}]:[{title:'示例 · 国际热点',source:'示例源',time:new Date().toISOString(),summary:'配置新闻 API Key 后显示真实国际新闻。'},{title:'示例 · 全球经贸与科技动态',source:'示例源',time:new Date().toISOString(),summary:'上线后展示实时更新的国际类新闻。'}];$('#newsList').innerHTML=items.map(n=>`<div class="news-item"><div class="nt">${esc(n.title)}</div><div class="nm"><span class="ns">🏷 ${esc(n.source)}</span><span>🕒 ${fmtDate(n.time)}</span></div><div style="margin-top:8px;color:var(--muted);font-size:13px;line-height:1.6">${esc(n.summary)}</div></div>`).join('')}load(cur)}
(function init(){const cur=localStorage.getItem(LS_CUR);if(cur&&allUsers()[cur]){state.email=cur;loadData();enterApp()}else{$('#auth').classList.remove('hidden')}}());
</script>
</body>
