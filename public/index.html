<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#a9bfb0" />
  <title>🍅 洋柿子的工作台</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- 登录/注册遮罩 -->
  <div id="auth" class="auth-overlay">
    <div class="auth-card">
      <div class="auth-logo">🍅</div>
      <h1 class="auth-title">洋柿子的工作台</h1>
      <p class="auth-sub">登录后，电脑 / 平板 / 手机 三端自动同步</p>
      <div class="auth-tabs">
        <button class="auth-tab active" data-mode="login">登录</button>
        <button class="auth-tab" data-mode="register">注册</button>
      </div>
      <input id="email" type="email" placeholder="邮箱" autocomplete="email" />
      <input id="password" type="password" placeholder="密码（至少 6 位）" autocomplete="current-password" />
      <button id="authBtn" class="btn-primary">登录</button>
      <p id="authMsg" class="auth-msg"></p>
    </div>
  </div>

  <!-- 应用主体 -->
  <div id="app" class="app hidden">
    <aside class="sidebar">
      <div class="brand">🍅<span>洋柿子</span></div>
      <nav id="nav">
        <button class="nav-item active" data-page="home">🏠 首页</button>
        <button class="nav-item" data-page="plans">📋 每日计划</button>
        <button class="nav-item" data-page="english">📚 四级英语</button>
        <button class="nav-item" data-page="sports">🏃 运动</button>
        <button class="nav-item" data-page="news">📰 每日热点</button>
      </nav>
      <div class="sidebar-foot">
        <span id="userEmail" class="user-email"></span>
        <button id="logoutBtn" class="btn-ghost">退出</button>
      </div>
    </aside>
    <main id="view" class="view"></main>
  </div>

  <script src="content.js"></script>
  <script src="app.js"></script>
</body>
</html>
